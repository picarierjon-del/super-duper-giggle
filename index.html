<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Agenda del Generale</title>
<style>
:root{--forest:#173d2b;--forest2:#24563d;--olive:#708453;--gold:#c9a861;--paper:#f4f1e7;--card:#fffef9;--ink:#17241c;--muted:#6f786f;--line:#dce0d7;--danger:#a43b35;--orange:#b87026;--shadow:0 8px 24px rgba(23,61,43,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--forest)}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:42px}
.hero{background:linear-gradient(145deg,#102d20,#1d4b35 62%,#315d42);color:white;padding:22px 18px 18px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(10,38,25,.2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#d9c997;font-weight:800}.brand{margin:4px 0 0;font-family:Georgia,serif;font-size:29px;line-height:1}.round{width:42px;height:42px;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(255,255,255,.1);color:white;font-size:19px}
.quote{font-size:12px;color:rgba(255,255,255,.72);margin:8px 0 16px}.calendar-nav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}.navbtn{border:0;border-radius:12px;height:42px;background:rgba(255,255,255,.1);color:white;font-size:20px}.datebox{position:relative;text-align:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:9px}.datebox strong{display:block;font-size:15px}.datebox span{font-size:11px;color:#d8dfd9}.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.day{border:0;background:transparent;color:rgba(255,255,255,.7);border-radius:11px;padding:6px 2px}.day small{display:block;font-size:9px;text-transform:uppercase}.day b{display:grid;place-items:center;margin:3px auto 0;width:28px;height:28px;font-size:12px}.day.active{background:#f6f1df;color:var(--forest)}.day.today b{outline:1px solid var(--gold);border-radius:50%}.day.has::after{content:"";display:block;width:4px;height:4px;background:var(--gold);border-radius:50%;margin:2px auto 0}
.content{padding:14px}.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px;box-shadow:var(--shadow)}.stat b{font-size:20px;color:var(--forest)}.stat span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:2px}.progress{height:5px;background:#dfe4dc;border-radius:9px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--olive),var(--gold));width:0}
.next{margin-top:12px;background:linear-gradient(135deg,#233f2f,#172d22);color:white;border-radius:17px;padding:13px 14px;display:flex;gap:11px;align-items:center;box-shadow:var(--shadow)}.next-icon{font-size:22px}.next div{min-width:0}.next small{color:#c8d2cb;text-transform:uppercase;font-size:9px;letter-spacing:1px}.next strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;margin-top:2px}.next time{margin-left:auto;font-weight:800;color:#e2ca8a;font-size:12px;white-space:nowrap}
.toolbar{display:flex;gap:8px;margin:14px 0 10px}.search{flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:11px 12px 11px 37px;color:var(--ink);outline:0}.search span{position:absolute;left:13px;top:10px}.primary{border:0;border-radius:13px;background:var(--forest);color:white;padding:0 15px;font-weight:800;box-shadow:0 5px 13px rgba(23,61,43,.18)}
.filters{display:flex;gap:6px;overflow:auto;padding:1px 0 7px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;white-space:nowrap}.chip.active{background:var(--forest);border-color:var(--forest);color:white}
.section{margin-top:13px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 7px}.section-head h2{font-family:Georgia,serif;font-size:17px;margin:0}.section-head span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--olive);border-radius:14px;padding:11px;box-shadow:0 3px 14px rgba(23,61,43,.05)}.task.high{border-left-color:var(--danger)}.task.medium{border-left-color:var(--orange)}.check{width:24px;height:24px;border:2px solid #aab3aa;border-radius:50%;background:white;flex:0 0 auto;color:white}.task.done{opacity:.55}.task.done .check{background:var(--forest);border-color:var(--forest)}.task.done .name{text-decoration:line-through}.task-main{flex:1;min-width:0}.name{font-weight:750;font-size:14px;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--muted);margin-top:3px}.tag{display:inline-block;background:#e7eee8;color:var(--forest);padding:2px 6px;border-radius:6px;margin-right:4px;font-weight:800}.more{border:0;background:transparent;color:var(--muted);font-size:20px;padding:5px}.empty{text-align:center;border:1px dashed #cbd2c9;border-radius:16px;padding:28px 15px;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--forest);margin-bottom:4px;font-family:Georgia,serif;font-size:17px}
.fab{position:fixed;right:max(18px,calc((100vw - 720px)/2 + 18px));bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:3px solid #f1e5c5;background:var(--forest);color:white;font-size:25px;box-shadow:0 10px 28px rgba(15,49,32,.3);z-index:20}
.overlay{position:fixed;inset:0;background:rgba(8,24,16,.58);backdrop-filter:blur(5px);z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:100%;max-width:720px;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head h3{font-family:Georgia,serif;font-size:22px;margin:0}.x{border:0;background:#e1e5dd;border-radius:50%;width:34px;height:34px;font-size:18px}.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.type{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 3px;font-size:10px;color:var(--muted);font-weight:750}.type span{display:block;font-size:18px;margin-bottom:3px}.type.active{background:var(--forest);color:white;border-color:var(--forest)}
.field{margin:9px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800;margin:0 0 5px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;outline:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{width:100%;border:0;border-radius:13px;background:var(--forest);color:white;font-weight:800;padding:13px;margin-top:7px}.danger{background:var(--danger)}.secondary{background:#dde4dd;color:var(--forest)}
.switchrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:12px}.switchrow label{font-size:12px;font-weight:750}.switch{accent-color:var(--forest);width:20px;height:20px}.settings-grid{display:grid;gap:8px}.action{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;font-weight:700;color:var(--ink)}.archive{display:grid;gap:6px;margin-top:10px}.archive-item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:9px;border-radius:11px;font-size:12px}.archive-item div{flex:1;min-width:0}.archive-item button{border:0;background:transparent;color:var(--danger)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#12291d;color:white;padding:10px 15px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:721px){.hero{margin-top:14px;border-radius:26px}.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}.fab{bottom:25px}}
</style>
</head>
<body>
<main class="app">
 <header class="hero">
  <div class="top"><div><div class="eyebrow">Agenda di comando</div><h1 class="brand">Il Generale</h1></div><button class="round" id="settings" aria-label="Centro comando">â</button></div>
  <p class="quote">Ordine, disciplina, azione. Una giornata alla volta.</p>
  <div class="calendar-nav"><button class="navbtn" id="prev">â¹</button><div class="datebox"><strong id="dateLong"></strong><span>Tocca per aprire il calendario</span><input id="datePicker" type="date"></div><button class="navbtn" id="next">âº</button></div>
  <div class="week" id="week"></div>
 </header>
 <div class="content">
  <div class="status"><div class="stat"><b id="total">0</b><span>Ordini del giorno</span></div><div class="stat"><b id="done">0</b><span>Completati</span></div><div class="stat"><b id="urgent">0</b><span>PrioritÃ  alta</span></div></div>
  <div class="progress"><i id="progress"></i></div>
  <div class="next" id="nextEvent"><span class="next-icon">ðï¸</span><div><small>Prossima operazione</small><strong>Nessun impegno imminente</strong></div><time>â</time></div>
  <div class="toolbar"><div class="search"><span>â</span><input id="search" placeholder="Cerca nellâagendaâ¦"></div><button class="primary" id="today">Oggi</button></div>
  <div class="filters" id="filters"><button class="chip active" data-filter="all">Tutto</button><button class="chip" data-filter="event">Impegni</button><button class="chip" data-filter="deadline">Scadenze</button><button class="chip" data-filter="birthday">Compleanni</button><button class="chip" data-filter="routine">Routine</button></div>
  <div id="sections"></div>
 </div>
</main>
<button class="fab" id="add" aria-label="Registra impegno">ï¼</button>

<div class="overlay" id="editor"><div class="sheet">
 <div class="sheet-head"><h3 id="editorTitle">Registra impegno</h3><button class="x" data-close="editor">Ã</button></div>
 <div class="types"><button class="type active" data-type="event"><span>ð</span>Impegno</button><button class="type" data-type="deadline"><span>â</span>Scadenza</button><button class="type" data-type="birthday"><span>ð</span>Compleanno</button><button class="type" data-type="routine"><span>â»</span>Routine</button></div>
 <div class="field"><label>Titolo</label><input id="title" maxlength="120" placeholder="Cosa devi fare?"></div>
 <div class="field"><label>Note (facoltative)</label><textarea id="notes" rows="2" maxlength="300" placeholder="Dettagli utiliâ¦"></textarea></div>
 <div class="row"><div class="field"><label>Data</label><input id="itemDate" type="date"></div><div class="field" id="timeField"><label>Ora</label><input id="itemTime" type="time"></div></div>
 <div class="row"><div class="field"><label>PrioritÃ </label><select id="priority"><option value="low">Normale</option><option value="medium">Importante</option><option value="high">Critica</option></select></div><div class="field" id="slotField" hidden><label>Momento</label><select id="slot"><option value="morning">Mattina</option><option value="evening">Sera</option></select></div></div>
 <div class="switchrow" id="alarmRow"><label>ð Sveglia / promemoria</label><input class="switch" id="alarm" type="checkbox"></div>
 <div class="field" id="reminderField" hidden><label>Avvisami</label><select id="reminder"><option value="0">Allâora stabilita</option><option value="15">15 minuti prima</option><option value="30">30 minuti prima</option><option value="60">1 ora prima</option><option value="120">2 ore prima</option><option value="1440">1 giorno prima</option></select></div>
 <button class="save" id="save">Salva nellâagenda</button><button class="save danger" id="delete" hidden>Elimina elemento</button>
</div></div>

<div class="overlay" id="command"><div class="sheet">
 <div class="sheet-head"><h3>Centro Comando</h3><button class="x" data-close="command">Ã</button></div>
 <div class="settings-grid"><button class="action" id="notify">ð Attiva notifiche</button><button class="action" id="export">â© Esporta backup JSON</button><label class="action">â§ Importa backup<input id="import" type="file" accept="application/json,.json" hidden></label><button class="action" id="cleanup">ð§¹ Pulisci storico completato</button></div>
 <div class="section-head" style="margin-top:18px"><h2>Archivio futuro</h2><span id="archiveCount"></span></div><div class="archive" id="archive"></div>
 <button class="save secondary" data-close="command">Chiudi centro comando</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{'use strict';
const KEY='agenda_generale_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let state={version:1,items:[],completions:{}};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.items))state={version:1,items:x.items,completions:x.completions||{}}}catch(e){}
let selected=iso(new Date()), filter='all', editing=null, type='event';
const labels={event:'Impegno',deadline:'Scadenza',birthday:'Compleanno',routine:'Routine'};
const icons={event:'ð',deadline:'â',birthday:'ð',routine:'â»'};
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function occurrence(item,date){if(item.type==='routine')return true;if(item.type==='birthday')return item.date&&item.date.slice(5)===date.slice(5);return item.date===date}
function completionKey(item,date){return `${item.id}@${date}`}
function isDone(item,date){return !!state.completions[completionKey(item,date)]}
function dayItems(date){return state.items.filter(i=>occurrence(i,date))}
function fmtDate(s,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'}){return parse(s).toLocaleDateString('it-IT',opts)}
function eventStamp(i,year){let d=i.date;if(i.type==='birthday'&&year)d=year+i.date.slice(4);return new Date(`${d}T${i.time||'00:00'}:00`).getTime()}
function renderWeek(){const base=parse(selected), day=base.getDay()||7, mon=new Date(base);mon.setDate(base.getDate()-day+1);$('#week').innerHTML='';for(let n=0;n<7;n++){const d=new Date(mon);d.setDate(mon.getDate()+n);const s=iso(d),b=document.createElement('button');b.className='day'+(s===selected?' active':'')+(s===iso(new Date())?' today':'')+(dayItems(s).length?' has':'');b.innerHTML=`<small>${d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','')}</small><b>${d.getDate()}</b>`;b.onclick=()=>{selected=s;render()};$('#week').appendChild(b)}}
function taskCard(i){const done=isDone(i,selected), time=i.time?` Â· ${i.time}`:'', note=i.notes?` Â· ${esc(i.notes)}`:'';return `<article class="task ${i.priority||'low'} ${done?'done':''}" data-id="${i.id}"><button class="check" aria-label="Completa">${done?'â':''}</button><div class="task-main"><div class="name">${esc(i.title)}</div><div class="meta"><span class="tag">${icons[i.type]} ${labels[i.type]}</span>${time}${note}${i.alarm?' Â· ð':''}</div></div><button class="more" aria-label="Modifica">â®</button></article>`}
function addSection(title,arr){if(!arr.length)return '';return `<section class="section"><div class="section-head"><h2>${title}</h2><span>${arr.length}</span></div><div class="list">${arr.map(taskCard).join('')}</div></section>`}
function nextOccurrence(){const now=Date.now(), candidates=[];state.items.forEach(i=>{if(i.type==='routine')return;if(i.type==='birthday'){for(const y of [new Date().getFullYear(),new Date().getFullYear()+1]){const t=eventStamp(i,y);if(t>=now)candidates.push({...i,_stamp:t,_date:new Date(t)})}}else{const t=eventStamp(i);if(t>=now)candidates.push({...i,_stamp:t,_date:new Date(t)})}});return candidates.sort((a,b)=>a._stamp-b._stamp)[0]}
function render(){
 $('#datePicker').value=selected;$('#dateLong').textContent=fmtDate(selected);renderWeek();
 let all=dayItems(selected), done=all.filter(i=>isDone(i,selected)).length, urgent=all.filter(i=>i.priority==='high'&&!isDone(i,selected)).length;
 $('#total').textContent=all.length;$('#done').textContent=done;$('#urgent').textContent=urgent;$('#progress').style.width=(all.length?Math.round(done/all.length*100):0)+'%';
 const q=$('#search').value.trim().toLowerCase();let view=all.filter(i=>(filter==='all'||i.type===filter)&&(!q||(i.title+' '+(i.notes||'')).toLowerCase().includes(q)));
 const sorted=a=>a.sort((x,y)=>(x.time||'99:99').localeCompare(y.time||'99:99'));
 let html='';html+=addSection('Impegni e appuntamenti',sorted(view.filter(i=>i.type==='event')));html+=addSection('Scadenze e ricorrenze',sorted(view.filter(i=>i.type==='deadline'||i.type==='birthday')));html+=addSection('Routine del mattino',view.filter(i=>i.type==='routine'&&i.slot!=='evening'));html+=addSection('Routine della sera',view.filter(i=>i.type==='routine'&&i.slot==='evening'));
 $('#sections').innerHTML=html||`<div class="empty"><b>Giornata libera</b>Nessuna operazione registrata per questa data.</div>`;
 const ne=nextOccurrence(),box=$('#nextEvent');if(ne){box.querySelector('strong').textContent=ne.title;box.querySelector('time').textContent=ne._date.toLocaleDateString('it-IT',{day:'2-digit',month:'short'})+(ne.time?' Â· '+ne.time:'')}else{box.querySelector('strong').textContent='Nessun impegno imminente';box.querySelector('time').textContent='â'}
 bindCards();checkAlarms();
}
function bindCards(){$$('.task').forEach(el=>{const id=el.dataset.id;el.querySelector('.check').onclick=()=>{const k=completionKey(state.items.find(i=>i.id===id),selected);if(state.completions[k])delete state.completions[k];else state.completions[k]=Date.now();saveState();render()};el.querySelector('.more').onclick=()=>openEditor(id)})}
function setType(t){type=t;$$('.type').forEach(b=>b.classList.toggle('active',b.dataset.type===t));const routine=t==='routine', birthday=t==='birthday';$('#slotField').hidden=!routine;$('#timeField').hidden=routine||birthday;$('#alarmRow').hidden=routine;$('#itemDate').closest('.field').querySelector('label').textContent=birthday?'Data di nascita':'Data';if(routine)$('#reminderField').hidden=true;else $('#reminderField').hidden=!$('#alarm').checked}
function openEditor(id=null){editing=id;const i=id?state.items.find(x=>x.id===id):null;$('#editorTitle').textContent=i?'Modifica elemento':'Registra impegno';$('#title').value=i?.title||'';$('#notes').value=i?.notes||'';$('#itemDate').value=i?.date||selected;$('#itemTime').value=i?.time||'09:00';$('#priority').value=i?.priority||'low';$('#slot').value=i?.slot||'morning';$('#alarm').checked=!!i?.alarm;$('#reminder').value=String(i?.reminder??30);$('#delete').hidden=!i;setType(i?.type||'event');$('#editor').classList.add('open');setTimeout(()=>$('#title').focus(),120)}
function close(id){$('#'+id).classList.remove('open')}
function persistEditor(){const title=$('#title').value.trim();if(!title)return toast('Inserisci un titolo');if(type!=='routine'&&!$('#itemDate').value)return toast('Seleziona una data');if(type==='event'&&!$('#itemTime').value)return toast('Seleziona un orario');const old=editing?state.items.find(i=>i.id===editing):null;const item={id:old?.id||uid(),title,notes:$('#notes').value.trim(),type,date:type==='routine'?null:$('#itemDate').value,time:(type==='event'||type==='deadline')?$('#itemTime').value:null,priority:$('#priority').value,slot:type==='routine'?$('#slot').value:null,alarm:type!=='routine'&&$('#alarm').checked,reminder:Number($('#reminder').value),notifiedFor:old?.notifiedFor||null,createdAt:old?.createdAt||Date.now()};if(old)Object.assign(old,item);else state.items.push(item);saveState();close('editor');render();toast(old?'Elemento aggiornato':'Registrato nellâagenda')}
function removeEditing(){if(!editing)return;if(confirm('Eliminare definitivamente questo elemento?')){state.items=state.items.filter(i=>i.id!==editing);Object.keys(state.completions).filter(k=>k.startsWith(editing+'@')).forEach(k=>delete state.completions[k]);saveState();close('editor');render();toast('Elemento eliminato')}}
function renderArchive(){const now=Date.now();const arr=state.items.filter(i=>i.type!=='routine'&&(i.type==='birthday'||eventStamp(i)>=now-86400000)).sort((a,b)=>eventStamp(a)-eventStamp(b));$('#archiveCount').textContent=arr.length+' elementi';$('#archive').innerHTML=arr.slice(0,50).map(i=>`<div class="archive-item"><span>${icons[i.type]}</span><div><b>${esc(i.title)}</b><br><small>${i.date?fmtDate(i.date,{day:'2-digit',month:'2-digit',year:'numeric'}):''}${i.time?' Â· '+i.time:''}</small></div><button data-edit="${i.id}">â</button></div>`).join('')||'<div class="empty">Archivio vuoto.</div>';$$('[data-edit]').forEach(b=>b.onclick=()=>{close('command');openEditor(b.dataset.edit)})}
async function requestNotifications(){if(!('Notification'in window))return toast('Notifiche non supportate');const p=await Notification.requestPermission();toast(p==='granted'?'Notifiche attivate':'Permesso non concesso')}
function checkAlarms(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();let changed=false;state.items.forEach(i=>{if(!i.alarm||i.type==='routine'||!i.date)return;const target=eventStamp(i),fire=target-(i.reminder||0)*60000,key=`${i.date}T${i.time||'00:00'}-${i.reminder}`;if(now>=fire&&now<target+300000&&i.notifiedFor!==key){new Notification('Agenda del Generale',{body:`${i.title}${i.time?' alle '+i.time:''}`});i.notifiedFor=key;changed=true}});if(changed)saveState()}
$('#add').onclick=()=>openEditor();$('#settings').onclick=()=>{renderArchive();$('#command').classList.add('open')};$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)close(o.id)}));
$('#prev').onclick=()=>{const d=parse(selected);d.setDate(d.getDate()-1);selected=iso(d);render()};$('#next').onclick=()=>{const d=parse(selected);d.setDate(d.getDate()+1);selected=iso(d);render()};$('#today').onclick=()=>{selected=iso(new Date());render()};$('#datePicker').onchange=e=>{if(e.target.value){selected=e.target.value;render()}};$('#search').oninput=render;
$('#filters').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.filter;$$('.chip').forEach(x=>x.classList.toggle('active',x===b));render()};$$('.type').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('#alarm').onchange=()=>$('#reminderField').hidden=!$('#alarm').checked;$('#save').onclick=persistEditor;$('#delete').onclick=removeEditing;$('#notify').onclick=requestNotifications;
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`agenda_generale_backup_${iso(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.items))throw 0;if(confirm('Sostituire i dati attuali con questo backup?')){state={version:1,items:x.items,completions:x.completions||{}};saveState();render();renderArchive();toast('Backup importato')}}catch(_){alert('File di backup non valido')}};r.readAsText(f);e.target.value=''};
$('#cleanup').onclick=()=>{if(confirm('Rimuovere lo storico delle spunte piÃ¹ vecchio di 30 giorni?')){const limit=Date.now()-30*86400000;Object.keys(state.completions).forEach(k=>{if(state.completions[k]<limit)delete state.completions[k]});state.items=state.items.filter(i=>i.type==='routine'||i.type==='birthday'||eventStamp(i)>=limit);saveState();render();renderArchive();toast('Storico ripulito')}};
setInterval(checkAlarms,30000);render();
})();
