<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SmartBudget" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10433/10433048.png">
  <title>SmartBudget Pro</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #05070a;
      --card: #11141b;
      --accent: #6366f1;
      --good: #10b981;
      --bad: #ef4444;
      --text: #ffffff;
      --text-dim: #8e96aa;
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      margin: 0;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      overflow-x: hidden;
    }

    .view { display: none; padding: 20px; animation: viewIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .view.active { display: block; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    header { padding: 40px 20px 10px; }
    h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    h2 { font-size: 14px; margin: 0 0 15px 0; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 30px;
      padding: 24px;
      margin-bottom: 20px;
    }

    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); margin: 0 0 8px 6px; }
    input, select {
      width: 100%;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 16px;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.secondary { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); }
    .btn.danger { background: rgba(239, 68, 68, 0.15); color: var(--bad); }

    /* Navigazione */
    nav {
      position: fixed;
      bottom: 25px; left: 20px; right: 20px;
      background: rgba(25, 28, 35, 0.85);
      backdrop-filter: blur(20px);
      display: flex;
      padding: 8px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: var(--text-dim); text-decoration: none; font-size: 10px; font-weight: 700; padding: 8px 0; }
    .nav-item.active { color: var(--accent); }
    .nav-item i { font-style: normal; font-size: 22px; margin-bottom: 2px; opacity: 0.5; }
    .nav-item.active i { opacity: 1; }

    /* List Item Modern */
    .tx-card {
      display: flex;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .tx-info { flex: 1; }
    .tx-info b { display: block; font-size: 15px; margin-bottom: 2px; }
    .tx-info span { font-size: 12px; color: var(--text-dim); }
    .tx-right { text-align: right; display: flex; align-items: center; gap: 12px; }
    .tx-amt { font-weight: 800; font-size: 15px; }
    .tx-del { background: rgba(239, 68, 68, 0.1); border: none; color: var(--bad); padding: 8px; border-radius: 12px; font-size: 12px; }

    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: white; color: black; padding: 12px 24px;
      border-radius: 50px; font-weight: 700; display: none; z-index: 2000;
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="view-cassa" class="view active">
  <header><h1>Cassa</h1></header>
  <div class="card">
    <div style="display:flex; background:rgba(0,0,0,0.3); border-radius:20px; padding:5px; margin-bottom:20px">
      <button id="type-exp" style="flex:1; border:none; padding:12px; border-radius:16px; background:var(--accent); color:white; font-weight:700" onclick="setType('expense')">Spesa</button>
      <button id="type-inc" style="flex:1; border:none; padding:12px; border-radius:16px; background:transparent; color:var(--text-dim); font-weight:700" onclick="setType('income')">Entrata</button>
    </div>

    <label>Importo</label>
    <input type="number" id="txAmount" inputmode="decimal" placeholder="0.00" style="font-size: 32px; text-align: center; color: var(--accent); background:transparent; border:none">

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px">
      <div><label>Categoria</label><select id="txCategory"></select></div>
      <div><label>Data</label><input type="date" id="txDate"></div>
    </div>

    <label>Descrizione</label>
    <input type="text" id="txTag" placeholder="Esempio: Cena fuori">

    <button class="btn" onclick="saveTx()">Salva Movimento</button>
  </div>
</div>

<div id="view-analisi" class="view">
  <header style="display:flex; justify-content:space-between; align-items:center">
    <h1>Report</h1>
    <select id="filterMonth" style="width:auto; margin:0; padding:8px; border-radius:12px; background:var(--card)"></select>
  </header>

  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin: 20px 0">
    <div class="card" style="margin:0; padding:15px; text-align:center">
      <div style="font-size:11px; color:var(--text-dim)">ENTRATE</div>
      <div id="kpi-inc" style="color:var(--good); font-weight:800; font-size:18px">+0€</div>
    </div>
    <div class="card" style="margin:0; padding:15px; text-align:center">
      <div style="font-size:11px; color:var(--text-dim)">USCITE</div>
      <div id="kpi-exp" style="color:var(--bad); font-weight:800; font-size:18px">-0€</div>
    </div>
  </div>

  <div class="card">
    <h2>Categorie</h2>
    <canvas id="chartCats" height="200"></canvas>
  </div>

  <div class="card" style="padding-bottom:100px">
    <h2>Cronologia</h2>
    <div id="txList"></div>
  </div>
</div>

<div id="view-setup" class="view">
  <header><h1>Setup</h1></header>
  <div class="card">
    <h2>Categorie</h2>
    <div style="display:flex; gap:10px">
      <input type="text" id="newCategory" placeholder="Nuova..." style="margin:0">
      <button class="btn" onclick="addCategory()" style="width:60px; padding:0">+</button>
    </div>
  </div>

  <div class="card">
    <h2 style="color:var(--bad)">Manutenzione</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px">
      <input type="date" id="cleanFrom" style="margin:0">
      <input type="date" id="cleanTo" style="margin:0">
    </div>
    <button class="btn danger" onclick="cleanRange()">Cancella Intervallo</button>
  </div>

  <div class="card">
    <h2>Dati</h2>
    <button class="btn secondary" onclick="exportData()" style="margin-bottom:10px">Esporta JSON</button>
    <button class="btn secondary" onclick="importData()">Importa JSON</button>
    <button class="btn danger" onclick="resetAll()" style="margin-top:20px; border:none; background:transparent">Reset Totale</button>
  </div>
</div>

<nav>
  <a href="#" class="nav-item active" onclick="showView('cassa', this)"><i>💰</i><span>CASSA</span></a>
  <a href="#" class="nav-item" onclick="showView('analisi', this)"><i>📊</i><span>ANALISI</span></a>
  <a href="#" class="nav-item" onclick="showView('setup', this)"><i>⚙️</i><span>SETUP</span></a>
</nav>

<script>
  let state = {
    categories: ["🛒 Spesa", "🏠 Casa", "🚗 Viaggi", "🍕 Svago", "🏥 Salute", "📦 Altro"],
    txs: [],
    currentType: 'expense',
    editingId: null
  };

  const LS_KEY = "SmartBudget_V4_Final";

  function init() {
    const saved = localStorage.getItem(LS_KEY);
    if(saved) state = JSON.parse(saved);
    document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
    renderAll();
  }

  function showView(viewId, el) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    el.classList.add('active');
    if(viewId === 'analisi') renderAll();
  }

  function setType(type) {
    state.currentType = type;
    const isExp = type === 'expense';
    document.getElementById('type-exp').style.background = isExp ? 'var(--accent)' : 'transparent';
    document.getElementById('type-inc').style.background = !isExp ? 'var(--accent)' : 'transparent';
  }

  function saveTx() {
    const amt = document.getElementById('txAmount').value;
    if(!amt) return notify("Inserisci importo");
    
    const newTx = {
      id: state.editingId || Date.now(),
      type: state.currentType,
      amount: parseFloat(amt),
      category: document.getElementById('txCategory').value,
      tag: document.getElementById('txTag').value || "Senza titolo",
      date: document.getElementById('txDate').value
    };

    if(state.editingId) {
      state.txs = state.txs.map(t => t.id === state.editingId ? newTx : t);
      state.editingId = null;
    } else {
      state.txs.push(newTx);
    }

    localStorage.setItem(LS_KEY, JSON.stringify(state));
    resetForm();
    notify("Salvato!");
    renderAll();
  }

  function resetForm() {
    document.getElementById('txAmount').value = "";
    document.getElementById('txTag').value = "";
    state.editingId = null;
  }

  function deleteTx(id) {
    if(confirm("Eliminare questo movimento?")) {
      state.txs = state.txs.filter(t => t.id !== id);
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      renderAll();
      notify("Eliminato");
    }
  }

  function editTx(id) {
    const tx = state.txs.find(t => t.id === id);
    if(!tx) return;
    state.editingId = id;
    setType(tx.type);
    document.getElementById('txAmount').value = tx.amount;
    document.getElementById('txCategory').value = tx.category;
    document.getElementById('txTag').value = tx.tag;
    document.getElementById('txDate').value = tx.date;
    showView('cassa', document.querySelector('.nav-item'));
    notify("Modalità modifica");
  }

  function renderAll() {
    document.getElementById('txCategory').innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    
    const months = Array.from(new Set(state.txs.map(t => t.date.slice(0,7)))).sort().reverse();
    const filterM = document.getElementById('filterMonth');
    const currM = filterM.value || (months.length ? months[0] : new Date().toISOString().slice(0,7));
    filterM.innerHTML = (months.length ? months : [currM]).map(m => `<option value="${m}" ${m===currM?'selected':''}>${m}</option>`).join('');

    const filtered = state.txs.filter(t => t.date.startsWith(currM));
    const inc = filtered.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
    const exp = filtered.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);

    document.getElementById('kpi-inc').textContent = "+" + inc.toFixed(2) + "€";
    document.getElementById('kpi-exp').textContent = "-" + exp.toFixed(2) + "€";

    document.getElementById('txList').innerHTML = filtered.sort((a,b) => b.id - a.id).map(t => `
      <div class="tx-card">
        <div class="tx-info" onclick="editTx(${t.id})">
          <b>${t.tag}</b>
          <span>${t.category} • ${t.date}</span>
        </div>
        <div class="tx-right">
          <div class="tx-amt" style="color:${t.type==='income'?'var(--good)':'white'}">
            ${t.type==='income'?'+':'-'}${t.amount.toFixed(2)}€
          </div>
          <button class="tx-del" onclick="deleteTx(${t.id})">🗑️</button>
        </div>
      </div>
    `).join('') || '<p style="text-align:center; color:var(--text-dim); padding:20px;">Vuoto</p>';

    renderChart(filtered);
  }

  let myChart = null;
  function renderChart(data) {
    const ctx = document.getElementById('chartCats').getContext('2d');
    const expenses = data.filter(t => t.type === 'expense');
    const totals = {};
    expenses.forEach(e => totals[e.category] = (totals[e.category] || 0) + e.amount);
    if(myChart) myChart.destroy();
    myChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(totals),
        datasets: [{
          data: Object.values(totals),
          backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#f87171', '#a78bfa'],
          borderWidth: 0, spacing: 5
        }]
      },
      options: { cutout: '85%', plugins: { legend: { display: false } } }
    });
  }

  function cleanRange() {
    const from = document.getElementById('cleanFrom').value, to = document.getElementById('cleanTo').value;
    if(!from || !to) return notify("Scegli le date");
    if(confirm("Eliminare movimenti selezionati?")) {
      state.txs = state.txs.filter(t => t.date < from || t.date > to);
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      renderAll();
      notify("Pulizia completata");
    }
  }

  function addCategory() {
    const val = document.getElementById('newCategory').value;
    if(val) {
      state.categories.push(val);
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      document.getElementById('newCategory').value = "";
      renderAll();
      notify("Aggiunta");
    }
  }

  function notify(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
    const a = document.createElement('a'); a.href = dataStr; a.download = 'backup.json'; a.click();
  }

  function importData() {
    const inp = document.createElement('input'); inp.type = 'file';
    inp.onchange = e => {
      const reader = new FileReader();
      reader.onload = r => {
        state = JSON.parse(r.target.result);
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        renderAll(); notify("Backup caricato");
      };
      reader.readAsText(e.target.files[0]);
    };
    inp.click();
  }

  function resetAll() { if(confirm("Cancellare tutto?")) { localStorage.clear(); location.reload(); } }

  document.getElementById('filterMonth').onchange = renderAll;
  window.onload = init;
</script>
</body>
</html>
