<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SmartBudget" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10433/10433048.png">
  <title>SmartBudget</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --good: #4ade80;
      --bad: #f87171;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --nav-bg: rgba(30, 41, 59, 0.8);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px; /* Spazio per la nav bar */
      overflow-x: hidden;
    }

    /* Layout Strutturale */
    .view { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    header {
      padding: 40px 20px 20px;
      background: linear-gradient(to bottom, rgba(56, 189, 248, 0.1), transparent);
    }

    h1 { margin: 0; font-size: 24px; font-weight: 800; }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Form Smart */
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; margin-left: 4px; }
    input, select, textarea {
      width: 100%;
      background: #334155;
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: white;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
    .btn.danger { background: rgba(248, 113, 113, 0.1); color: var(--bad); border: 1px solid var(--bad); }

    /* Bottom Nav Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      padding: 15px 10px calc(15px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-item.active { color: var(--accent); }
    .nav-item i { font-size: 20px; margin-bottom: 4px; }

    /* Analisi & KPI */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--card); padding: 15px; border-radius: 20px; text-align: center; }
    .kpi .label { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
    .kpi .val { font-size: 16px; font-weight: 700; }

    /* Tabelle Movimenti */
    .tx-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .tx-info div:first-child { font-weight: 600; font-size: 14px; }
    .tx-info div:last-child { font-size: 11px; color: var(--text-muted); }
    .tx-amt { font-family: monospace; font-weight: 700; }

    .toast {
      position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--bg); padding: 10px 25px;
      border-radius: 50px; font-weight: 600; display: none; z-index: 1000;
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="view-cassa" class="view active">
  <header>
    <h1>Cassa</h1>
    <p style="color:var(--text-muted)">Inserimento rapido</p>
  </header>
  
  <div class="card">
    <label>Tipo Movimento</label>
    <div style="display:flex; gap:10px; margin-bottom:15px">
      <button class="btn" id="type-exp" style="flex:1" onclick="setType('expense')">Uscita</button>
      <button class="btn outline" id="type-inc" style="flex:1" onclick="setType('income')">Entrata</button>
    </div>

    <label>Importo (€)</label>
    <input type="number" id="txAmount" inputmode="decimal" placeholder="0.00">

    <label>Categoria</label>
    <select id="txCategory"></select>

    <label>Nota / Tag</label>
    <input type="text" id="txTag" placeholder="Esempio: Pizza con amici">

    <label>Data</label>
    <input type="date" id="txDate">

    <button class="btn" onclick="saveTx()" style="background:var(--good); color:var(--bg)">REGISTRA</button>
  </div>
</div>

<div id="view-analisi" class="view">
  <header>
    <h1>Analisi</h1>
    <select id="filterMonth" style="margin-top:10px; padding:8px; border-radius:10px; width:auto"></select>
  </header>

  <div class="kpi-grid" id="kpis"></div>

  <div class="card">
    <canvas id="chartCats" height="200"></canvas>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Ultimi Movimenti</h3>
    <div id="txList"></div>
  </div>
</div>

<div id="view-setup" class="view">
  <header>
    <h1>Setup</h1>
  </header>

  <div class="card">
    <h3>Gestione Categorie</h3>
    <div style="display:flex; gap:10px">
      <input type="text" id="newCategory" placeholder="Nome categoria..." style="margin-bottom:0">
      <button class="btn" onclick="addCategory()" style="width:80px; padding:0">+</button>
    </div>
  </div>

  <div class="card">
    <h3>Dati e Backup</h3>
    <button class="btn outline" onclick="exportData()" style="margin-bottom:10px">Esporta Dati (JSON)</button>
    <button class="btn outline" onclick="importData()" style="margin-bottom:20px">Importa Dati</button>
    <button class="btn danger" onclick="resetAll()">Resetta Tutto</button>
  </div>
  
  <p style="text-align:center; color:var(--text-muted); font-size:12px">SimpleBudget v2.0 - Local Storage</p>
</div>

<nav>
  <a href="javascript:void(0)" class="nav-item active" onclick="showView('cassa', this)">
    <i>💰</i><span>CASSA</span>
  </a>
  <a href="javascript:void(0)" class="nav-item" onclick="showView('analisi', this)">
    <i>📊</i><span>ANALISI</span>
  </a>
  <a href="javascript:void(0)" class="nav-item" onclick="showView('setup', this)">
    <i>⚙️</i><span>SETUP</span>
  </a>
</nav>

<script>
  let state = {
    categories: ["Spesa", "Casa", "Trasporti", "Svago", "Altro"],
    txs: [],
    currentType: 'expense'
  };

  const LS_KEY = "SmartBudget_V2";

  function init() {
    const saved = localStorage.getItem(LS_KEY);
    if(saved) state = JSON.parse(saved);
    document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
    renderAll();
  }

  function showView(viewId, el) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    el.classList.add('active');
    renderAll();
  }

  function setType(type) {
    state.currentType = type;
    document.getElementById('type-exp').className = type === 'expense' ? 'btn' : 'btn outline';
    document.getElementById('type-inc').className = type === 'income' ? 'btn' : 'btn outline';
  }

  function saveTx() {
    const amt = document.getElementById('txAmount').value;
    if(!amt) return notify("Inserisci importo!");
    
    const tx = {
      id: Date.now(),
      type: state.currentType,
      amount: parseFloat(amt),
      category: document.getElementById('txCategory').value,
      tag: document.getElementById('txTag').value,
      date: document.getElementById('txDate').value
    };

    state.txs.push(tx);
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    document.getElementById('txAmount').value = "";
    document.getElementById('txTag').value = "";
    notify("Registrato!");
  }

  function renderAll() {
    // Populate Categories
    const catSel = document.getElementById('txCategory');
    catSel.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');

    // Populate Months
    const months = Array.from(new Set(state.txs.map(t => t.date.slice(0,7)))).sort().reverse();
    if(months.length === 0) months.push(new Date().toISOString().slice(0,7));
    const filterM = document.getElementById('filterMonth');
    const selectedMonth = filterM.value || months[0];
    filterM.innerHTML = months.map(m => `<option value="${m}" ${m===selectedMonth?'selected':''}>${m}</option>`).join('');

    // Analisi Logic
    const filtered = state.txs.filter(t => t.date.startsWith(selectedMonth));
    const inc = filtered.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
    const exp = filtered.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);

    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="label">Entrate</div><div class="val" style="color:var(--good)">+${inc.toFixed(2)}€</div></div>
      <div class="kpi"><div class="label">Uscite</div><div class="val" style="color:var(--bad)">-${exp.toFixed(2)}€</div></div>
      <div class="kpi" style="grid-column: span 2"><div class="label">Risparmio</div><div class="val">${(inc-exp).toFixed(2)}€</div></div>
    `;

    document.getElementById('txList').innerHTML = filtered.sort((a,b)=>b.id-a.id).map(t => `
      <div class="tx-row">
        <div class="tx-info">
          <div>${t.tag || t.category}</div>
          <div>${t.date} • ${t.category}</div>
        </div>
        <div class="tx-amt" style="color:${t.type==='income'?'var(--good)':'var(--bad)'}">
          ${t.type==='income'?'+':'-'}${t.amount.toFixed(2)}
        </div>
      </div>
    `).join('');

    renderChart(filtered);
  }

  let myChart = null;
  function renderChart(data) {
    const ctx = document.getElementById('chartCats').getContext('2d');
    const expenses = data.filter(t => t.type === 'expense');
    const totals = {};
    expenses.forEach(e => totals[e.category] = (totals[e.category] || 0) + e.amount);

    if(myChart) myChart.destroy();
    myChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(totals),
        datasets: [{
          data: Object.values(totals),
          backgroundColor: ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#a78bfa']
        }]
      },
      options: { plugins: { legend: { position: 'bottom', labels: { color: 'white' } } } }
    });
  }

  function addCategory() {
    const val = document.getElementById('newCategory').value;
    if(val) {
      state.categories.push(val);
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      document.getElementById('newCategory').value = "";
      notify("Categoria aggiunta");
      renderAll();
    }
  }

  function notify(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'budget_backup.json'; a.click();
  }

  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        state = JSON.parse(reader.result);
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        renderAll();
        notify("Dati importati!");
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function resetAll() {
    if(confirm("Cancellare tutto definitivamente?")) {
      localStorage.clear();
      location.reload();
    }
  }

  window.onload = init;
</script>
</body>
</html>
