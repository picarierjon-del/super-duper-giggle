<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SmartBudget" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10433/10433048.png">
  <title>SmartBudget SuperTop</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #05070a;
      --card: #11141b;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --good: #10b981;
      --bad: #ef4444;
      --text: #ffffff;
      --text-dim: #8e96aa;
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      margin: 0;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top);
      overflow-x: hidden;
    }

    /* Animazioni Fluide */
    .view { display: none; padding: 20px; animation: viewIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .view.active { display: block; }
    @keyframes viewIn { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    header { padding: 40px 20px 20px; }
    h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    h2 { font-size: 16px; margin: 0 0 15px 0; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    /* Cards Ultra Premium */
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 32px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    /* Inputs Eleganti */
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); margin: 0 0 10px 6px; }
    input, select {
      width: 100%;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
      -webkit-appearance: none;
    }
    input:focus { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }

    /* Button "Smart" */
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 22px;
      padding: 20px;
      width: 100%;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 10px 25px var(--accent-soft);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:active { transform: scale(0.95); opacity: 0.9; }
    .btn.secondary { background: var(--glass); box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
    .btn.danger { background: rgba(239, 68, 68, 0.1); color: var(--bad); }

    /* Floating Navigation */
    nav {
      position: fixed;
      bottom: 30px;
      left: 20px;
      right: 20px;
      background: rgba(25, 28, 35, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      padding: 10px;
      border-radius: 35px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      z-index: 1000;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      padding: 10px 0;
    }
    .nav-item i { font-style: normal; font-size: 24px; margin-bottom: 4px; opacity: 0.4; transition: 0.3s; }
    .nav-item.active { color: var(--accent); }
    .nav-item.active i { opacity: 1; transform: scale(1.1); }

    /* Stats Display */
    .hero-balance { text-align: center; padding: 40px 0; }
    .hero-balance div { color: var(--text-dim); font-size: 15px; font-weight: 500; }
    .hero-balance h3 { font-size: 52px; margin: 10px 0; font-weight: 800; letter-spacing: -2px; }

    .stat-pill {
      background: var(--glass);
      padding: 16px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-pill .l { font-size: 11px; color: var(--text-dim); font-weight: 700; }
    .stat-pill .v { font-size: 17px; font-weight: 800; }

    /* List Design */
    .tx-card {
      display: flex;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .tx-icon { width: 48px; height: 48px; border-radius: 18px; background: var(--glass); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 16px; }
    .tx-data { flex: 1; }
    .tx-data b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .tx-data span { font-size: 12px; color: var(--text-dim); }
    .tx-price { text-align: right; font-weight: 800; font-size: 16px; }

    .toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: white; color: black; padding: 14px 28px;
      border-radius: 50px; font-weight: 700; font-size: 14px; display: none; z-index: 2000;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="view-cassa" class="view active">
  <header>
    <h1>Cassa</h1>
  </header>
  
  <div class="card">
    <div style="display:flex; background:rgba(0,0,0,0.3); border-radius:24px; padding:6px; margin-bottom:30px">
      <button id="type-exp" style="flex:1; border:none; padding:14px; border-radius:20px; background:var(--accent); color:white; font-weight:700" onclick="setType('expense')">Spesa</button>
      <button id="type-inc" style="flex:1; border:none; padding:14px; border-radius:20px; background:transparent; color:var(--text-dim); font-weight:700" onclick="setType('income')">Entrata</button>
    </div>

    <label>Importo</label>
    <input type="number" id="txAmount" inputmode="decimal" placeholder="0.00" style="font-size: 32px; text-align: center; font-weight: 800; border:none; background:transparent; margin-bottom: 30px; color: var(--accent)">

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
      <div>
        <label>Categoria</label>
        <select id="txCategory"></select>
      </div>
      <div>
        <label>Data</label>
        <input type="date" id="txDate">
      </div>
    </div>

    <label>Descrizione</label>
    <input type="text" id="txTag" placeholder="Per cosa?">

    <button class="btn" onclick="saveTx()">Registra Ora</button>
  </div>
</div>

<div id="view-analisi" class="view">
  <header style="display:flex; justify-content:space-between; align-items:center">
    <h1>Analisi</h1>
    <select id="filterMonth" style="width:auto; margin:0; padding:10px 15px; border-radius:15px; background:var(--card)"></select>
  </header>

  <div class="hero-balance">
    <div>Risparmio Mensile</div>
    <h3 id="totalBalance">0.00€</h3>
  </div>

  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:30px">
    <div class="stat-pill">
      <div class="l">Entrate</div>
      <div class="v" id="kpi-inc" style="color:var(--good)">+0€</div>
    </div>
    <div class="stat-pill">
      <div class="l">Uscite</div>
      <div class="v" id="kpi-exp" style="color:var(--bad)">-0€</div>
    </div>
  </div>

  <div class="card">
    <h2>Andamento</h2>
    <canvas id="chartCats" height="240"></canvas>
  </div>

  <div class="card" style="padding-bottom: 100px;">
    <h2>Cronologia</h2>
    <div id="txList"></div>
  </div>
</div>

<div id="view-setup" class="view">
  <header><h1>Setup</h1></header>

  <div class="card">
    <h2>Nuova Categoria</h2>
    <div style="display:flex; gap:12px">
      <input type="text" id="newCategory" placeholder="es. Viaggi" style="margin:0">
      <button class="btn" onclick="addCategory()" style="width:65px; padding:0">+</button>
    </div>
  </div>

  <div class="card">
    <h2 style="color:var(--bad)">Pulizia Dati</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px">
      <input type="date" id="cleanFrom" style="margin:0">
      <input type="date" id="cleanTo" style="margin:0">
    </div>
    <button class="btn danger" onclick="cleanRange()">Elimina Intervallo</button>
  </div>

  <div class="card">
    <h2>Archivio</h2>
    <button class="btn secondary" onclick="exportData()" style="margin-bottom:12px">Esporta Backup</button>
    <button class="btn secondary" onclick="importData()">Importa Backup</button>
    <button class="btn danger" onclick="resetAll()" style="margin-top:20px; border:none; background:transparent">Reset Fabbrica</button>
  </div>
</div>

<nav>
  <a href="#" class="nav-item active" onclick="showView('cassa', this)"><i>💸</i><span>CASSA</span></a>
  <a href="#" class="nav-item" onclick="showView('analisi', this)"><i>📊</i><span>ANALISI</span></a>
  <a href="#" class="nav-item" onclick="showView('setup', this)"><i>⚙️</i><span>SETUP</span></a>
</nav>

<script>
  let state = {
    categories: ["🛒 Spesa", "🏠 Casa", "🚗 Mobilità", "🎮 Svago", "🏥 Salute", "📦 Altro"],
    txs: [],
    currentType: 'expense'
  };

  const LS_KEY = "SmartBudget_Top_V3";

  function init() {
    const saved = localStorage.getItem(LS_KEY);
    if(saved) state = JSON.parse(saved);
    document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
    renderAll();
  }

  function showView(viewId, el) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    el.classList.add('active');
    if(viewId === 'analisi') renderAll();
  }

  function setType(type) {
    state.currentType = type;
    const isExp = type === 'expense';
    const bExp = document.getElementById('type-exp'), bInc = document.getElementById('type-inc');
    bExp.style.background = isExp ? 'var(--accent)' : 'transparent';
    bExp.style.color = isExp ? 'white' : 'var(--text-dim)';
    bInc.style.background = !isExp ? 'var(--accent)' : 'transparent';
    bInc.style.color = !isExp ? 'white' : 'var(--text-dim)';
  }

  function saveTx() {
    const amt = document.getElementById('txAmount').value;
    if(!amt || amt <= 0) return notify("Cifra non valida");
    state.txs.push({
      id: Date.now(),
      type: state.currentType,
      amount: parseFloat(amt),
      category: document.getElementById('txCategory').value,
      tag: document.getElementById('txTag').value || "Senza titolo",
      date: document.getElementById('txDate').value
    });
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    document.getElementById('txAmount').value = ""; document.getElementById('txTag').value = "";
    notify("Movimento registrato ✨");
    renderAll();
  }

  function renderAll() {
    document.getElementById('txCategory').innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    
    const months = Array.from(new Set(state.txs.map(t => t.date.slice(0,7)))).sort().reverse();
    const filterM = document.getElementById('filterMonth');
    const currM = filterM.value || (months.length ? months[0] : new Date().toISOString().slice(0,7));
    filterM.innerHTML = (months.length ? months : [currM]).map(m => `<option value="${m}" ${m===currM?'selected':''}>${m}</option>`).join('');

    const filtered = state.txs.filter(t => t.date.startsWith(currM));
    const inc = filtered.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
    const exp = filtered.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);

    document.getElementById('totalBalance').textContent = (inc - exp).toFixed(2) + "€";
    document.getElementById('kpi-inc').textContent = "+" + inc.toFixed(2) + "€";
    document.getElementById('kpi-exp').textContent = "-" + exp.toFixed(2) + "€";

    document.getElementById('txList').innerHTML = filtered.sort((a,b) => b.id - a.id).map(t => `
      <div class="tx-card">
        <div class="tx-icon">${t.type === 'income' ? '⚡' : '🔥'}</div>
        <div class="tx-data">
          <b>${t.tag}</b>
          <span>${t.category}</span>
        </div>
        <div class="tx-price" style="color:${t.type==='income'?'var(--good)':'var(--text)'}">
          ${t.type==='income'?'+':'-'}${t.amount.toFixed(2)}€
        </div>
      </div>
    `).join('') || '<p style="text-align:center; color:var(--text-dim); padding:20px;">Nessun dato per questo mese</p>';

    renderChart(filtered);
  }

  let myChart = null;
  function renderChart(data) {
    const ctx = document.getElementById('chartCats').getContext('2d');
    const expenses = data.filter(t => t.type === 'expense');
    const totals = {};
    expenses.forEach(e => totals[e.category] = (totals[e.category] || 0) + e.amount);
    if(myChart) myChart.destroy();
    if(expenses.length === 0) return;
    myChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(totals),
        datasets: [{
          data: Object.values(totals),
          backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#f87171', '#a78bfa', '#06b6d4'],
          borderWidth: 0,
          spacing: 8
        }]
      },
      options: { cutout: '82%', plugins: { legend: { display: false } } }
    });
  }

  function cleanRange() {
    const from = document.getElementById('cleanFrom').value, to = document.getElementById('cleanTo').value;
    if(!from || !to) return notify("Seleziona date");
    if(confirm("Eliminare movimenti in questo periodo?")) {
      state.txs = state.txs.filter(t => t.date < from || t.date > to);
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      renderAll();
      notify("Intervallo pulito");
    }
  }

  function addCategory() {
    const val = document.getElementById('newCategory').value;
    if(!val) return;
    state.categories.push(val);
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    document.getElementById('newCategory').value = "";
    renderAll();
    notify("Categoria aggiunta");
  }

  function notify(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
    const a = document.createElement('a'); a.href = dataStr; a.download = 'budget.json'; a.click();
  }

  function importData() {
    const inp = document.createElement('input'); inp.type = 'file';
    inp.onchange = e => {
      const reader = new FileReader();
      reader.onload = r => {
        state = JSON.parse(r.target.result);
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        renderAll(); notify("Backup importato");
      };
      reader.readAsText(e.target.files[0]);
    };
    inp.click();
  }

  function resetAll() { if(confirm("Cancellare tutto?")) { localStorage.clear(); location.reload(); } }

  document.getElementById('filterMonth').onchange = renderAll;
  window.onload = init;
</script>
</body>
</html>
