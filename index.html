<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Budget Pro - IndexedDB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-item { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
        <div class="bg-slate-800 text-white p-6">
            <h1 class="text-2xl font-bold mb-4">🏠 Contabilità Domestica Avanzata</h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-700 p-4 rounded-lg">
                    <p class="text-sm text-slate-400">Entrate Totali</p>
                    <p id="total-in" class="text-2xl font-semibold text-green-400">€ 0.00</p>
                </div>
                <div class="bg-slate-700 p-4 rounded-lg">
                    <p class="text-sm text-slate-400">Uscite Totali</p>
                    <p id="total-out" class="text-2xl font-semibold text-red-400">€ 0.00</p>
                </div>
                <div class="bg-slate-700 p-4 rounded-lg">
                    <p class="text-sm text-slate-400">Saldo Attuale</p>
                    <p id="total-balance" class="text-2xl font-bold text-white">€ 0.00</p>
                </div>
            </div>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-4">
                <h2 class="text-lg font-bold border-b pb-2">Aggiungi Movimento</h2>
                <input type="date" id="date" class="w-full p-2 border rounded">
                <input type="text" id="desc" placeholder="Descrizione (es. Affitto, Stipendio)" class="w-full p-2 border rounded">
                <input type="number" id="amount" placeholder="Importo €" class="w-full p-2 border rounded">
                <select id="type" class="w-full p-2 border rounded">
                    <option value="entrata">Entrata (+)</option>
                    <option value="uscita">Uscita (-)</option>
                </select>
                <button onclick="addData()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Salva Movimento</button>
                
                <hr class="my-6">
                
                <h2 class="text-lg font-bold border-b pb-2">Filtri e Opzioni</h2>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="show-in" checked onchange="renderUI()"> <label>Mostra Entrate</label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="show-out" checked onchange="renderUI()"> <label>Mostra Uscite</label>
                </div>
                
                <div class="pt-4 space-y-2">
                    <label class="text-sm">Filtra per data (Dal / Al):</label>
                    <input type="date" id="filter-from" class="w-full p-2 border rounded text-sm">
                    <input type="date" id="filter-to" class="w-full p-2 border rounded text-sm">
                    <button onclick="renderUI()" class="w-full bg-gray-200 py-1 rounded text-sm">Applica Filtro</button>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">Registro Movimenti</h2>
                    <div class="space-x-2">
                        <button onclick="exportData()" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">Export JSON</button>
                        <button onclick="document.getElementById('importFile').click()" class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded">Import</button>
                        <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b">
                                <th class="p-2">Data</th>
                                <th class="p-2">Descrizione</th>
                                <th class="p-2 text-right">Importo</th>
                                <th class="p-2">Azione</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            </tbody>
                    </table>
                </div>
                
                <div class="mt-6 p-4 bg-red-50 rounded-lg">
                    <p class="text-xs font-bold text-red-600 mb-2">ZONA PERICOLO: Pulizia per data</p>
                    <div class="flex gap-2">
                        <button onclick="clearByRange()" class="bg-red-600 text-white text-xs px-3 py-2 rounded">Elimina dati nel range selezionato</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db;
        const request = indexedDB.open("HomeBudgetDB", 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("transactions")) {
                db.createObjectStore("transactions", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            renderUI();
        };

        // Aggiunta dati
        function addData() {
            const date = document.getElementById('date').value;
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            if (!date || !desc || isNaN(amount)) return alert("Compila tutti i campi!");

            const transaction = { date, desc, amount, type };
            const tx = db.transaction("transactions", "readwrite");
            tx.objectStore("transactions").add(transaction);
            tx.oncomplete = () => {
                resetForm();
                renderUI();
            };
        }

        function resetForm() {
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        }

        // Renderizzazione con filtri
        function renderUI() {
            const tx = db.transaction("transactions", "readonly");
            const store = tx.objectStore("transactions");
            const request = store.getAll();

            request.onsuccess = () => {
                let data = request.result;
                const showIn = document.getElementById('show-in').checked;
                const showOut = document.getElementById('show-out').checked;
                const from = document.getElementById('filter-from').value;
                const to = document.getElementById('filter-to').value;

                let tIn = 0, tOut = 0;
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                data.forEach(item => {
                    // Filtro Tipo
                    if (!showIn && item.type === 'entrata') return;
                    if (!showOut && item.type === 'uscita') return;

                    // Filtro Data
                    if (from && item.date < from) return;
                    if (to && item.date > to) return;

                    // Calcolo Totali
                    if (item.type === 'entrata') tIn += item.amount;
                    else tOut += item.amount;

                    // Render Riga
                    const row = `<tr class="border-b hover:bg-gray-50">
                        <td class="p-2 text-sm">${item.date}</td>
                        <td class="p-2">${item.desc}</td>
                        <td class="p-2 text-right font-mono ${item.type === 'entrata' ? 'text-green-600' : 'text-red-600'}">
                            ${item.type === 'entrata' ? '+' : '-'}${item.amount.toFixed(2)} €
                        </td>
                        <td class="p-2 text-center">
                            <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-600 text-xl">&times;</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });

                document.getElementById('total-in').innerText = `€ ${tIn.toFixed(2)}`;
                document.getElementById('total-out').innerText = `€ ${tOut.toFixed(2)}`;
                document.getElementById('total-balance').innerText = `€ ${(tIn - tOut).toFixed(2)}`;
            };
        }

        function deleteItem(id) {
            const tx = db.transaction("transactions", "readwrite");
            tx.objectStore("transactions").delete(id);
            tx.oncomplete = renderUI;
        }

        // Export/Import
        function exportData() {
            const tx = db.transaction("transactions", "readonly");
            tx.objectStore("transactions").getAll().onsuccess = (e) => {
                const blob = new Blob([JSON.stringify(e.target.result)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `budget_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const importedData = JSON.parse(e.target.result);
                const tx = db.transaction("transactions", "readwrite");
                const store = tx.objectStore("transactions");
                importedData.forEach(item => {
                    delete item.id; // Lasciamo che IndexedDB ne generi di nuovi
                    store.add(item);
                });
                tx.oncomplete = () => { alert("Importazione completata!"); renderUI(); };
            };
            reader.readAsText(file);
        }

        // Pulizia per range
        function clearByRange() {
            const from = document.getElementById('filter-from').value;
            const to = document.getElementById('filter-to').value;
            if(!from || !to) return alert("Seleziona prima un range di date 'Dal' e 'Al'");

            if(confirm(`Sei sicuro di voler eliminare TUTTI i dati dal ${from} al ${to}?`)) {
                const tx = db.transaction("transactions", "readwrite");
                const store = tx.objectStore("transactions");
                store.openCursor().onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value.date >= from && cursor.value.date <= to) {
                            cursor.delete();
                        }
                        cursor.continue();
                    }
                };
                tx.oncomplete = renderUI;
            }
        }
    </script>
</body>
</html>
